# 사이트 하나당 블록 하나. RSS 없는 블로그가 또 생기면 여기에 추가하면 됩니다.
#
#   id            생성될 파일 이름 (public/<id>.xml)
#   list_url      글 목록이 있는 페이지
#   item_sel      글 하나를 감싸는 요소의 CSS 셀렉터
#   title_sel     item_sel 안에서 제목이 있는 요소 (생략하면 item 전체 텍스트)
#   link_sel      item_sel 안에서 링크가 있는 요소 (생략하면 item 자신이 <a>거나 첫 a[href])
#   date_sel      item_sel 안에서 날짜가 있는 요소 (없으면 최초 발견 시각을 pubDate로 사용)
#   date_attr     날짜를 텍스트가 아닌 속성에서 읽을 때 (예: datetime)
#   date_formats  strptime 패턴 목록. 생략 시 흔한 한국식 포맷들을 자동 시도
#   enrich        true면 각 글 페이지를 한 번 받아 og:description을 본문 요약으로 사용
#   limit         피드에 담을 최대 글 수 (기본 20)

- id: kakaopay
  title: 카카오페이 기술 블로그
  description: 기술과 경험을 함께 공유합니다. (비공식 피드 — 공식 rss.xml이 비어 있어 목록 페이지에서 생성)
  home: https://tech.kakaopay.com/
  list_url: https://tech.kakaopay.com/
  item_sel: 'a[href^="/post/"]'
  title_sel: strong
  date_sel: time
  date_formats:
    - '%Y. %m. %d'
  enrich: true
  limit: 20

